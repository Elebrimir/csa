<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" style="background:#090d16; font-family:'Courier New', monospace;">
    <defs>
        <!-- Patterns for Hazard Exclusion Zones -->
        <pattern id="hazardHatchRed" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="12" stroke="#ef4444" stroke-width="2" opacity="0.7" />
        </pattern>
        <pattern id="hazardHatchAmber" width="10" height="10" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="10" stroke="#f59e0b" stroke-width="2" opacity="0.7" />
        </pattern>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Ocean Background -->
    <rect x="0" y="0" width="1000" height="640" fill="#08101e" />

    <!-- Lat / Lon Coordinate Grid -->
    <!-- Latitudes -->
    <line x1="60" y1="190.0" x2="940" y2="190.0" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="35" y="194.0" fill="#64748b" font-size="10">+10ºN</text>

    <!-- Equator -->
    <line x1="60" y1="320.0" x2="940" y2="320.0" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="324.0" fill="#38bdf8" font-size="11" font-weight="bold">EQUATOR</text>

    <line x1="60" y1="450.0" x2="940" y2="450.0" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="35" y="454.0" fill="#64748b" font-size="10">-10ºS</text>

    <!-- Longitudes -->
    <line x1="127.7" y1="60" x2="127.7" y2="580" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="127.7" y="600" fill="#64748b" font-size="10" text-anchor="middle">80ºW</text>

    <line x1="263.1" y1="60" x2="263.1" y2="580" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="263.1" y="600" fill="#64748b" font-size="10" text-anchor="middle">60ºW</text>

    <line x1="466.2" y1="60" x2="466.2" y2="580" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="466.2" y="600" fill="#64748b" font-size="10" text-anchor="middle">30ºW</text>

    <line x1="669.2" y1="60" x2="669.2" y2="580" stroke="#334155" stroke-width="1.5"/>
    <text x="669.2" y="600" fill="#38bdf8" font-size="10" text-anchor="middle" font-weight="bold">0º PRIME</text>

    <line x1="872.3" y1="60" x2="872.3" y2="580" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="872.3" y="600" fill="#64748b" font-size="10" text-anchor="middle">30ºE</text>

    <!-- Representative Landmasses (KSC continent & Eastern continent) -->
    <!-- KSC Peninsula -->
    <path d="M 60.0,125.0 L 161.5,164.0 L 164.9,320.0 L 154.8,515.0 L 60.0,515.0 Z" fill="#132338" stroke="#1e3a5f" stroke-width="1.5" />
    <text x="114.2" y="255.0" fill="#334155" font-size="11" font-weight="bold">WEST CONTINENT</text>

    <!-- Eastern Impact Continent -->
    <path d="M 804.6,125.0 L 926.5,164.0 L 940.0,515.0 L 818.2,515.0 L 791.1,320.0 Z" fill="#132338" stroke="#1e3a5f" stroke-width="1.5" />
    <text x="845.2" y="385.0" fill="#334155" font-size="11" font-weight="bold">EAST CONTINENT</text>

    <!-- Trajectory Flight Corridor (Equatorial East - Heading 90º) -->
    <path d="M 164.5,321.3 L 171.7,320.0 L 276.6,319.4 L 533.8,318.1 L 770.8,317.1 L 863.9,316.4" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>

    <!-- Hazard Zone 1: SRB Booster Drop Footprint (Offshore KSC) -->
    <ellipse cx="171.7" cy="320.0" rx="22" ry="16" fill="url(#hazardHatchAmber)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="171.7" y="298.0" fill="#f59e0b" font-size="9" text-anchor="middle" font-weight="bold">ZONE 1: SRB DROP (T+12s)</text>

    <!-- Hazard Zone 2: Stage 1 Core Drop Footprint (Ocean) -->
    <ellipse cx="276.6" cy="319.4" rx="45" ry="25" fill="url(#hazardHatchRed)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="276.6" y="287.4" fill="#ef4444" font-size="9" text-anchor="middle" font-weight="bold">ZONE 2: CORE MECO DROP (T+125s)</text>

    <!-- Apogee Point (In Space) -->
    <circle cx="533.8" cy="318.1" r="5" fill="#a855f7"/>
    <text x="533.8" y="304.1" fill="#a855f7" font-size="10" text-anchor="middle" font-weight="bold">APOGEE 269.1 KM (T+828s)</text>
    <text x="533.8" y="336.1" fill="#94a3b8" font-size="9" text-anchor="middle">Exospheric Microgravity Arc</text>

    <!-- Atmospheric Re-entry Point -->
    <circle cx="770.8" cy="317.1" r="4" fill="#f97316"/>
    <text x="770.8" y="305.1" fill="#f97316" font-size="9" text-anchor="middle" font-weight="bold">RE-ENTRY 70 KM (T+1252s)</text>

    <!-- Hazard Zone 3: Spacecraft Impact Site (East Continent) -->
    <ellipse cx="863.9" cy="316.4" rx="32" ry="20" fill="url(#hazardHatchRed)" stroke="#ef4444" stroke-width="2"/>
    <circle cx="863.9" cy="316.4" r="4" fill="#ef4444"/>
    <text x="863.9" y="290.4" fill="#ef4444" font-size="10" text-anchor="middle" font-weight="bold">ZONE 3: GROUND IMPACT (T+1380s)</text>
    <text x="863.9" y="344.4" fill="#fca5a5" font-size="9" text-anchor="middle">Lon +28.76º E, Lat +0.28º N (832m ASL)</text>

    <!-- KSC Marker -->
    <circle cx="164.5" cy="321.3" r="6" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
    <text x="154.5" y="309.3" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="end">KSC PAD (LAT -0.1º, LON -74.6º)</text>

    <!-- Header Box / NOTAM Document Title -->
    <rect x="0" y="0" width="1000" height="55" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="24" fill="#ef4444" font-size="14" font-weight="bold">KERBIN AVIATION ADMINISTRATION (KAA) // COMMERCIAL SPACE TRANSPORTATION</text>
    <text x="25" y="44" fill="#94a3b8" font-size="11">NOTAM NOTICE REF: KAA-CSA11-2026-11 | MISSION: CSA-11 (COROLT-IV B) | AZIMUTH: 090.0º EQUATORIAL</text>
    <rect x="760" y="10" width="220" height="35" fill="#1e293b" rx="4"/>
    <text x="870" y="32" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">RESTRICTED AIRSPACE</text>

    <!-- Footer Summary Box -->
    <rect x="50" y="590" width="900" height="35" fill="#0b1324" stroke="#1e293b" stroke-width="1" rx="4"/>
    <text x="65" y="612" fill="#94a3b8" font-size="10">LAUNCH CORRIDOR: Heading 090.0º East | TOTAL DOWNRANGE: 1,082 km | AIRSPACE STATUS: ALL COMMERCIAL CORRIDORS DIVERTED</text>
</svg>