<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" style="background:#0a1120; font-family: 'Courier New', Courier, monospace;">
    <defs>
        <!-- Hatched pattern for Hazard Exclusion Zones -->
        <pattern id="hazardHatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="12" stroke="#ef4444" stroke-width="2.5" opacity="0.8" />
        </pattern>
        <pattern id="boosterHatch" width="10" height="10" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="10" stroke="#f59e0b" stroke-width="2" opacity="0.8" />
        </pattern>
        <!-- Glow filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Ocean Background -->
    <rect x="0" y="0" width="960" height="640" fill="#0b1b2d" />

    <!-- Continental Landmass -->
    <polygon points="566.0,590.0 523.0,567.5 492.7,545.9 482.9,509.0 465.7,464.0 451.3,410.0 437.0,347.0 445.6,275.0 457.1,203.0 480.0,140.0 502.9,77.0 523.0,50.0 50.0,50.0 50.0,590.0" fill="#162e26" stroke="#22c55e" stroke-width="1.8" />

    <!-- Coordinate Grid -->
    <!-- Latitudes -->
    <g stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" opacity="0.6">
        <line x1="50" y1="545.0" x2="910" y2="545.0" stroke="#38bdf8" stroke-dasharray="5,5" stroke-width="1.2" />
        <line x1="50" y1="455.0" x2="910" y2="455.0" />
        <line x1="50" y1="365.0" x2="910" y2="365.0" />
        <line x1="50" y1="275.0" x2="910" y2="275.0" />
        <line x1="50" y1="185.0" x2="910" y2="185.0" />
        <line x1="50" y1="95.0" x2="910" y2="95.0" />
        
        <!-- Longitudes -->
        <line x1="193.33333333333331" y1="50" x2="193.33333333333331" y2="590" />
        <line x1="336.66666666666663" y1="50" x2="336.66666666666663" y2="590" />
        <line x1="480.0" y1="50" x2="480.0" y2="590" stroke="#a855f7" stroke-dasharray="2,4" stroke-width="1" />
        <line x1="623.3333333333333" y1="50" x2="623.3333333333333" y2="590" />
        <line x1="766.6666666666667" y1="50" x2="766.6666666666667" y2="590" />
    </g>

    <!-- Labels for Lat/Lon -->
    <text x="55" y="541.0" fill="#38bdf8" font-size="10" font-weight="bold">EQUATOR 0º</text>
    <text x="55" y="361.0" fill="#64748b" font-size="10">+20º LAT</text>
    <text x="55" y="181.0" fill="#64748b" font-size="10">+40º LAT</text>
    <text x="485.0" y="65" fill="#a855f7" font-size="10">-75º MERIDIAN (COASTLINE AXIS)</text>

    <!-- Geographic Annotations -->
    <text x="193.33333333333331" y="410.0" fill="#22c55e" font-size="14" font-weight="bold" opacity="0.5">MAINLAND KERBIN</text>
    <text x="680.6666666666666" y="320.0" fill="#38bdf8" font-size="14" font-weight="bold" opacity="0.5">EASTERN OCEAN</text>

    <!-- 1. HAZARD ZONE 1: Stage 1 Booster Drop Area -->
    <rect x="475.18666666666644" y="507.85" width="36" height="50" rx="8" fill="url(#boosterHatch)" stroke="#f59e0b" stroke-width="1.8" />
    <text x="518.1866666666665" y="532.85" fill="#f59e0b" font-size="10" font-weight="bold">STAGE 1 DROP ZONE (RT-10)</text>
    <text x="518.1866666666665" y="545.85" fill="#94a3b8" font-size="9">Lat +1.4º, Lon -74.5º | T+51s</text>

    <!-- 2. HAZARD ZONE 2: Northern Maritime Recovery Footprint -->
    <ellipse cx="490.0333333333332" cy="116.87" rx="30" ry="25" fill="url(#hazardHatch)" stroke="#ef4444" stroke-width="2" />
    <text x="270.0333333333332" y="104.87" fill="#ef4444" font-size="11" font-weight="bold">PRIMARY RECOVERY ZONE (NOTAM)</text>
    <text x="270.0333333333332" y="120.87" fill="#94a3b8" font-size="10">Target Footprint: +47.6ºN, -74.7ºW</text>
    <text x="270.0333333333332" y="134.87" fill="#38bdf8" font-size="9">Downrange: 499.2 km (Naval Salvage Zone)</text>

    <!-- FLIGHT CORRIDOR (Heading 005.0º NNE) -->
    <line x1="492.69933333333324" y1="545.873" x2="490.0333333333332" y2="116.87" stroke="#38bdf8" stroke-width="2.8" stroke-dasharray="6,4" filter="url(#glow)" />

    <!-- Trajectory Waypoint Markers -->
    <!-- Launch Pad KSC -->
    <circle cx="492.69933333333324" cy="545.873" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <text x="504.69933333333324" y="549.873" fill="#38bdf8" font-size="11" font-weight="bold">KSC LAUNCH COMPLEX</text>
    <text x="504.69933333333324" y="561.873" fill="#94a3b8" font-size="9">Lat -0.10º, Lon -74.56º</text>

    <!-- Apogee Marker -->
    <circle cx="491.4666666666668" cy="324.5" r="5" fill="#a855f7" />
    <text x="503.4666666666668" y="327.5" fill="#a855f7" font-size="10" font-weight="bold">APOGEE (415.5 km)</text>
    <text x="503.4666666666668" y="339.5" fill="#94a3b8" font-size="9">Van Allen Radiation Zone</text>

    <!-- Touchdown Marker -->
    <circle cx="490.0333333333332" cy="116.87" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" />

    <!-- Flight Direction Arrow -->
    <polygon points="492.69933333333324,505.87300000000005 487.69933333333324,520.873 497.69933333333324,520.873" fill="#38bdf8" />
    <text x="502.69933333333324" y="515.873" fill="#38bdf8" font-size="10" font-weight="bold">HEADING 005.0º</text>

    <!-- HEADER BLOCK -->
    <rect x="0" y="0" width="960" height="45" fill="#0f172a" />
    <text x="25" y="28" fill="#38bdf8" font-size="14" font-weight="bold">KERBAL AVIATION ADMINISTRATION (KAA) // AIRSPACE HAZARD NOTICE</text>
    <text x="650" y="28" fill="#f59e0b" font-size="12" font-weight="bold">NOTAM: KAA-CSA10-2026-10 (POLAR CORRIDOR)</text>

    <!-- LEGEND BOX -->
    <rect x="720" y="500" width="220" height="115" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <text x="735" y="520" fill="#f8fafc" font-size="11" font-weight="bold">OPERATIONAL LEGEND</text>
    
    <line x1="735" y1="540" x2="765" y2="540" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="775" y="544" fill="#94a3b8" font-size="10">Active Ascent Track (005º)</text>

    <rect x="735" y="555" width="20" height="12" fill="url(#boosterHatch)" stroke="#f59e0b" stroke-width="1"/>
    <text x="775" y="565" fill="#94a3b8" font-size="10">Stage 1 Debris Zone</text>

    <rect x="735" y="580" width="20" height="12" fill="url(#hazardHatch)" stroke="#ef4444" stroke-width="1"/>
    <text x="775" y="590" fill="#94a3b8" font-size="10">Marine Recovery Sector</text>

    <!-- FOOTER STATUS -->
    <rect x="0" y="615" width="960" height="25" fill="#020617" />
    <text x="25" y="632" fill="#64748b" font-size="10">COROLT SPACE AGENCY // FLIGHT OPERATIONS &amp; SAFETY DIVISION // RESTRICTED MARITIME CORRIDOR</text>
</svg>
