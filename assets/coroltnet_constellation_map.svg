<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 650" class="orbital-map-svg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <!-- Kerbin Atmospheric Halo -->
    <radialGradient id="kerbinAtmo" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Kerbin Planet Surface -->
    <linearGradient id="kerbinSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="75%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Antenna Beam Gradient -->
    <linearGradient id="activeBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Ground Link Gradient -->
    <linearGradient id="groundBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Space Backdrop -->
  <rect width="800" height="650" fill="url(#spaceGlow)" rx="12"/>

  <!-- Coordinate Grid Lines -->
  <circle cx="400" cy="325" r="280" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="400" y1="45" x2="400" y2="605" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="120" y1="325" x2="680" y2="325" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- 300 km Orbital Ring (R_orb = 210px in SVG scale, R_planet = 140px) -->
  <circle cx="400" cy="325" r="210" fill="none" stroke="rgba(0, 229, 255, 0.35)" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- Kerbin Atmosphere Glow Outer Ring -->
  <circle cx="400" cy="325" r="158" fill="url(#kerbinAtmo)"/>

  <!-- Kerbin Body -->
  <circle cx="400" cy="325" r="140" fill="url(#kerbinSurface)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Continents & Geographic Details on Kerbin -->
  <path d="M 370 240 Q 420 220 440 260 T 410 320 T 360 300 Z" fill="#15803d" opacity="0.75"/>
  <path d="M 320 330 Q 360 350 370 400 T 310 420 T 290 350 Z" fill="#166534" opacity="0.8"/>
  <path d="M 440 330 Q 490 310 510 370 T 460 410 T 430 350 Z" fill="#15803d" opacity="0.75"/>

  <!-- Header Banner -->
  <text x="40" y="45" fill="#00e5ff" font-size="16" font-weight="900" font-family="'Orbitron', sans-serif" letter-spacing="1.5">COROLT SPACE AGENCY // CONSTELLATION TRACKER</text>
  <text x="40" y="65" fill="#94a3b8" font-size="11" font-family="monospace">COROLTNET-LEO: 300 KM EQUATORIAL MESH (9-SLOT ARCHITECTURE // CH 100)</text>

  <!-- KSC (Kerbal Space Center) Ground Station on Equator (Lon 0º, at top/right boundary) -->
  <circle cx="400" cy="185" r="4.5" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="400" cy="185" r="10" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <text x="400" y="170" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle" font-family="'Orbitron', sans-serif">KSC DSN</text>

  <!-- Active Cross-Link Beam (CorolSat-1B to CoroltSat-1C) -->
  <line x1="400" y1="115" x2="474" y2="128" stroke="url(#activeBeam)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Ground Link Beams down to KSC (400, 185) -->
  <line x1="400" y1="115" x2="400" y2="185" stroke="url(#groundBeam)" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="474" y1="128" x2="400" y2="185" stroke="url(#groundBeam)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Slot 1: 40º Target -->
  <circle cx="535" cy="164" r="7" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="535" cy="164" r="2.5" fill="#facc15"/>
  <text x="548" y="158" fill="#facc15" font-size="10.5" font-weight="600" font-family="'Orbitron', sans-serif">Slot 1 (+40º)</text>
  <text x="548" y="172" fill="#94a3b8" font-size="9.5">CoroltSat-1D (Next)</text>

  <!-- Slot 2: 80º -->
  <circle cx="607" cy="289" r="5" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="618" y="293" fill="#64748b" font-size="9">Slot 2 (+80º)</text>

  <!-- Slot 3: 120º -->
  <circle cx="582" cy="430" r="5" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="593" y="435" fill="#64748b" font-size="9">Slot 3 (+120º)</text>

  <!-- Slot 4: 160º -->
  <circle cx="472" cy="522" r="5" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="472" y="542" fill="#64748b" font-size="9" text-anchor="middle">Slot 4 (+160º)</text>

  <!-- Slot 5: 200º -->
  <circle cx="328" cy="522" r="5" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="328" y="542" fill="#64748b" font-size="9" text-anchor="middle">Slot 5 (+200º)</text>

  <!-- Slot 6: 240º -->
  <circle cx="218" cy="430" r="5" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="135" y="435" fill="#64748b" font-size="9">Slot 6 (+240º)</text>

  <!-- Slot 7: 280º -->
  <circle cx="193" cy="289" r="5" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="110" y="293" fill="#64748b" font-size="9">Slot 7 (+280º)</text>

  <!-- Slot 8: 320º -->
  <circle cx="265" cy="164" r="5" fill="none" stroke="#475569" stroke-width="1.2"/>
  <text x="180" y="164" fill="#64748b" font-size="9">Slot 8 (+320º)</text>

  <!-- ACTIVE SATELLITE 1: CorolSat-1B (Slot 0, 0º -> 400, 115) -->
  <g transform="translate(400, 115)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="6" fill="#22c55e" filter="url(#glow)"/>
    <line x1="-12" y1="0" x2="-6" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="6" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
  <text x="375" y="90" fill="#22c55e" font-size="12" font-weight="700" text-anchor="end" font-family="'Orbitron', sans-serif">CorolSat-1B</text>
  <text x="375" y="104" fill="#94a3b8" font-size="9.5" text-anchor="end">Slot 0 (0.0º) // Active Relay</text>

  <!-- ACTIVE SATELLITE 2: CoroltSat-1C (+20.6º -> 474, 128) -->
  <g transform="translate(474, 128)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="6" fill="#00e5ff" filter="url(#glow)"/>
    <line x1="-10" y1="-5" x2="-5" y2="-2.5" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="5" y1="2.5" x2="10" y2="5" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
  <text x="500" y="100" fill="#00e5ff" font-size="12" font-weight="700" font-family="'Orbitron', sans-serif">CoroltSat-1C</text>
  <text x="500" y="114" fill="#94a3b8" font-size="9.5">+20.6º Phase // Active Relay</text>

  <!-- Range Indicators / Distance Badge -->
  <rect x="405" y="60" width="135" height="24" rx="4" fill="rgba(15, 23, 42, 0.85)" stroke="#00e5ff" stroke-width="0.8"/>
  <text x="472" y="76" fill="#00e5ff" font-size="9.5" font-weight="700" text-anchor="middle" font-family="'Orbitron', sans-serif">LINK: 323 km (NOMINAL)</text>

  <!-- Legend Deck in SVG -->
  <g transform="translate(30, 565)">
    <rect width="740" height="60" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    
    <circle cx="35" cy="30" r="5" fill="#22c55e"/>
    <text x="48" y="34" fill="#e2e8f0" font-size="11" font-weight="600">Active Node (Operational)</text>

    <circle cx="230" cy="30" r="5" fill="#00e5ff"/>
    <text x="243" y="34" fill="#e2e8f0" font-size="11" font-weight="600">Newly Inserted Node</text>

    <circle cx="420" cy="30" r="5" fill="#facc15"/>
    <text x="433" y="34" fill="#e2e8f0" font-size="11" font-weight="600">Next Scheduled Slot</text>

    <circle cx="610" cy="30" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="623" y="34" fill="#94a3b8" font-size="11">Planned Mesh Slot</text>
  </g>
</svg>
